[package]
edition      = "2024"
name         = "cheap_yellow_display_ex"
rust-version = "1.95.0"
version      = "0.1.0"

[[bin]]
name = "cheap_yellow_display_ex"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "1.1.1", features = ["esp32s3", "defmt", "unstable"] }
esp-backtrace = { version = "0.19.0", features = ["esp32s3", "panic-handler", "defmt"] }
embassy-executor = { version = "0.10", features = ["platform-riscv32"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
esp-rtos = { version = "0.3.0", features = ["esp32s3", "embassy", "defmt"] }
esp-println = { version = "0.17.0", features = ["esp32s3", "defmt-espflash"] }

defmt = "1.1.0"
defmt-rtt = "1.2.0"

esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3"] }

critical-section = "1.2.0"
embedded-graphics = "0.8"

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'


